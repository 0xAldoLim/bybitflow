services:
  desk:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      FLOW_DATA_DIR: /app/data
      FLOW_ADMIN_TOKEN: ${FLOW_ADMIN_TOKEN:?Set a long random dashboard password in .env}
    volumes:
      - research-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,base64; r=urllib.request.Request('http://127.0.0.1:8000/healthz'); r.add_header('Authorization','Basic '+base64.b64encode(('research:'+os.environ['FLOW_ADMIN_TOKEN']).encode()).decode()); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
volumes:
  research-data:
