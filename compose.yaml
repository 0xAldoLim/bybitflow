services:
  desk:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FLOW_DATA_DIR: /app/data
      FLOW_SCAN_ENABLED: ${FLOW_SCAN_ENABLED:-true}
      FLOW_SCAN_SECONDS: ${FLOW_SCAN_SECONDS:-300}
      FLOW_MARKET_SOURCE: ${FLOW_MARKET_SOURCE:-auto}
      FLOW_ADMIN_TOKEN: ${FLOW_ADMIN_TOKEN:?Set a long random dashboard password in .env}
    volumes:
      - research-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,base64; r=urllib.request.Request('http://127.0.0.1:8000/healthz'); r.add_header('Authorization','Basic '+base64.b64encode(('research:'+os.environ['FLOW_ADMIN_TOKEN']).encode()).decode()); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
  trainer:
    profiles: [ml]
    build:
      context: .
      target: trainer
    init: true
    restart: unless-stopped
    command: [bybit-flow, ml, worker]
    environment:
      FLOW_DATA_DIR: /app/data
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    env_file:
      - path: .env
        required: false
    volumes:
      - research-data:/app/data
    read_only: true
    tmpfs: [/tmp:size=256m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1
volumes:
  research-data:
