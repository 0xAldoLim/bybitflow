services:
  gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      FLOW_GATEWAY_DOMAIN: ${FLOW_GATEWAY_DOMAIN:?Set your real DNS hostname}
      FLOW_TV_TOKEN: ${FLOW_TV_TOKEN:?Set a random integration-only token of at least 32 characters}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      desk:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
volumes:
  caddy-data:
  caddy-config:
