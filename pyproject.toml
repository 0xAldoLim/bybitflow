[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-flow"
version = "0.1.0"
description = "Public-data, alerts-only perpetual futures research workstation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "websockets>=15,<17", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3",
  "numpy>=2.2,<3", "pyarrow>=19,<24", "duckdb>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
ml = ["scikit-learn==1.9.0", "lightgbm==4.7.0", "scipy==1.18.1"]

[project.scripts]
bybit-flow = "bybit_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bybit_flow = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
