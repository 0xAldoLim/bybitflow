name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.lock -r requirements-ml.lock && pip install --no-deps -e .
      - run: ruff check src tests examples
      - run: pytest -q
      - run: python examples/offline_research.py
